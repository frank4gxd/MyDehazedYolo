# Ultralytics 🚀 AGPL-3.0
# YOLO12 + DINO（Cache+Fuse），不改 loss、不改 Detect 输出

# Parameters
nc: 5
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, DinoCache, ["convnext_small.dinov3_lvd1689m", [1, 2, 3], True, True]]  # 0: 只缓存 DINO 特征，返回原图
  - [-1, 1, Conv, [64, 3, 2]]          # 1  P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 2  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 3
  - [-1, 1, Conv, [256, 3, 2]]         # 4  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 5
  - [-1, 1, Conv, [512, 3, 2]]         # 6  P4/16
  - [-1, 4, A2C2f, [512, True, 4]]     # 7
  - [-1, 1, Conv, [1024, 3, 2]]        # 8  P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]    # 9

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 7], 1, Concat, [1]]                   # 11  cat P4
  - [-1, 2, A2C2f, [512, False, -1]]            # 12  P4 stage1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 5], 1, Concat, [1]]                   # 14  cat P3
  - [-1, 2, A2C2f, [256, False, -1]]            # 15  P3
  - [-1, 1, DinoFuse, [0, 4, 0.1, 0.1]]         # 16  ★ fuse P3 (level=0)

  - [-1, 1, Conv, [256, 3, 2]]                  # 17
  - [[-1, 12], 1, Concat, [1]]                  # 18  cat P4
  - [-1, 2, A2C2f, [512, False, -1]]            # 19  P4 refined
  - [-1, 1, DinoFuse, [1, 4, 0.1, 0.1]]         # 20  ★ fuse P4 (level=1)

  - [-1, 1, Conv, [512, 3, 2]]                  # 21
  - [[-1, 9], 1, Concat, [1]]                   # 22  cat P5
  - [-1, 2, C3k2, [1024, True]]                 # 23  P5 large
  - [-1, 1, DinoFuse, [2, 4, 0.1, 0.1]]         # 24  ★ fuse P5 (level=2)

  - [[16, 20, 24], 1, Detect, [nc]]             # 25  Detect(P3,P4,P5) 用融合后的层
